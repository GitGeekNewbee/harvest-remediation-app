<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Harvest Concept Lab - Dashboard</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
    
    :root { 
      --slate-50: #f8fafc; --slate-100: #f1f5f9; --slate-200: #e2e8f0; --slate-300: #cbd5e1;
      --slate-400: #94a3b8; --slate-500: #64748b; --slate-700: #334155; --slate-900: #0f172a;
      --indigo: #4f46e5; --indigo-light: #e0e7ff;
      --emerald: #059669; --emerald-light: #d1fae5;
      --rose: #e11d48; --rose-light: #ffe4e6;
      --amber: #d97706; --amber-light: #fef3c7;
      --radius: 12px;
    }
    
    body { font-family: 'Inter', -apple-system, sans-serif; margin: 0; background: var(--slate-50); color: var(--slate-900); display: flex; justify-content: center; min-height: 100dvh; }
    .app-container { width: 100%; max-width: 500px; background: #ffffff; min-height: 100%; display: flex; flex-direction: column; box-shadow: 0 0 20px rgba(0,0,0,0.05); }
    
    /* Header & Profile */
    .header { background: var(--slate-900); color: white; padding: 25px 20px 20px; border-radius: 0 0 20px 20px; margin-bottom: 20px; }
    .app-title { font-size: 1.6rem; font-weight: 800; margin: 0 0 5px 0; letter-spacing: -0.5px; }
    .student-profile { display: flex; align-items: center; gap: 8px; color: var(--slate-300); font-size: 1.05rem; font-weight: 600; margin-bottom: 15px; cursor: pointer; }
    .student-profile:hover { color: white; }
    .stats-row { display: flex; gap: 10px; }
    .stat-badge { background: rgba(255,255,255,0.1); padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .stat-badge.xp { color: var(--amber); }
    
    /* Current Focus Card */
    .content-area { padding: 0 20px 30px; flex-grow: 1; }
    .focus-card { background: linear-gradient(135deg, var(--indigo), #4338ca); border-radius: var(--radius); padding: 25px 20px; color: white; margin-bottom: 25px; box-shadow: 0 10px 25px rgba(79, 70, 229, 0.25); position: relative; overflow: hidden; }
    .focus-label { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: var(--indigo-light); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    .focus-title { font-size: 1.8rem; font-weight: 800; margin: 0 0 5px 0; line-height: 1.1; }
    .focus-section { font-size: 1rem; color: var(--indigo-light); font-weight: 600; margin-bottom: 20px; }
    .btn-resume { background: white; color: var(--indigo); border: none; padding: 12px 24px; border-radius: 30px; font-weight: 800; font-size: 1.05rem; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
    .btn-resume:active { transform: scale(0.96); }

    /* Course Outline */
    .section-title { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; color: var(--slate-400); font-weight: 800; margin-bottom: 12px; }
    .module-group { background: white; border: 1px solid var(--slate-200); border-radius: var(--radius); margin-bottom: 12px; padding: 18px 20px; transition: border-color 0.2s; }
    .module-group.active-group { border-color: var(--indigo); border-width: 2px; padding: 17px 19px; }
    .module-group-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
    .group-name { font-size: 1.2rem; font-weight: 800; color: var(--slate-900); margin: 0; }
    .group-progress { font-size: 0.9rem; font-weight: 600; color: var(--slate-500); display: flex; align-items: center; gap: 6px; }
    .group-progress.complete { color: var(--emerald); }
    
    .module-list { display: flex; flex-direction: column; gap: 8px; margin-top: 15px; border-top: 1px solid var(--slate-100); padding-top: 15px; }
    .module-item { display: flex; align-items: center; justify-content: space-between; font-size: 0.95rem; font-weight: 600; color: var(--slate-700); padding: 8px 0; text-decoration: none; }
    .module-item.locked { color: var(--slate-300); pointer-events: none; }
    .module-item.completed { color: var(--emerald); }
    .module-item.current { color: var(--indigo); font-weight: 800; }
    
    /* Footer */
    .footer { padding: 20px; text-align: center; border-top: 1px solid var(--slate-200); margin-top: auto; }
    .btn-reset { background: transparent; border: 2px dashed var(--slate-300); color: var(--slate-500); font-weight: 700; padding: 12px; border-radius: var(--radius); width: 100%; cursor: pointer; transition: 0.2s; font-size: 0.9rem; }
    .btn-reset:hover { background: var(--rose-light); border-color: var(--rose); color: var(--rose); }
  </style>
</head>
<body>

<div class="app-container">
  
  <div class="header">
    <h1 class="app-title">Concept Lab</h1>
    <div class="student-profile" onclick="editName()" title="Click to edit name">
      <span id="student-name">Student</span> ✏️
    </div>
    <div class="stats-row">
      <div class="stat-badge xp">⭐ <span id="xp-total">0</span> XP</div>
      <div class="stat-badge">🔥 <span id="streak-total">0</span> Day Streak</div>
    </div>
  </div>

  <div class="content-area">
    <div class="focus-card">
      <div class="focus-label">✦ CURRENT FOCUS</div>
      <h2 class="focus-title" id="focus-title">INT-01</h2>
      <div class="focus-section" id="focus-section">Integers</div>
      <a href="#" id="btn-resume" class="btn-resume">Resume Journey ➔</a>
    </div>

    <div class="section-title">Course Outline</div>
    
    <div id="curriculum-container">
      <!-- Injected via JS -->
    </div>
  </div>

  <div class="footer">
    <button class="btn-reset" onclick="resetProfile()">Reset Test Profile & Telemetry</button>
  </div>

</div>

<script>
  // V2 Curriculum Architecture (Global Synchronized Array)
  const curriculum = [
    { id: 'RAT-01', name: 'Equivalent Ratios', group: 'Ratios & Rates' },
    { id: 'RAT-02', name: 'Simplifying Ratios', group: 'Ratios & Rates' },
    { id: 'RAT-03', name: 'Sharing in a Ratio', group: 'Ratios & Rates' },
    { id: 'RAT-04', name: 'Increasing in a Ratio', group: 'Ratios & Rates' },
    { id: 'RAT-05', name: 'Decreasing in a Ratio', group: 'Ratios & Rates' },
    { id: 'RAT-06', name: 'Direct Proportion', group: 'Ratios & Rates' },
    { id: 'RAT-07', name: 'Unit Rates', group: 'Ratios & Rates' },
    { id: 'RAT-08', name: 'Speed, Distance, Time', group: 'Ratios & Rates' },
    { id: 'DEC-01', name: 'Place Value & Tenths', group: 'Decimals' },
    { id: 'DEC-02', name: 'Hundredths & Thousandths', group: 'Decimals' },
    { id: 'DEC-03', name: 'Comparing Decimals', group: 'Decimals' },
    { id: 'DEC-04', name: 'Rounding', group: 'Decimals' },
    { id: 'DEC-05', name: 'Adding Decimals', group: 'Decimals' },
    { id: 'DEC-06', name: 'Subtracting Decimals', group: 'Decimals' },
    { id: 'DEC-07', name: 'Multiplying Decimals', group: 'Decimals' },
    { id: 'DEC-08', name: 'Dividing Decimals', group: 'Decimals' },
    { id: 'INT-01', name: 'Additive Inverses', group: 'Integers' },
    { id: 'INT-02', name: 'Subtracting Integers', group: 'Integers' },
    { id: 'INT-03', name: 'Multiplying Integers', group: 'Integers' },
    { id: 'INT-04', name: 'Dividing Integers', group: 'Integers' },
    { id: 'INT-05', name: 'BODMAS & Integers', group: 'Integers' },
    { id: 'PER-01', name: '100-Grid Percentages', group: 'Percentages' },
    { id: 'PER-02', name: 'Scaling to 100', group: 'Percentages' },
    { id: 'PER-03', name: 'Percentage of an Amount', group: 'Percentages' },
    { id: 'ALG-01', name: 'Variables & Constants', group: 'Algebra' },
    { id: 'ALG-02', name: 'Writing Expressions', group: 'Algebra' },
    { id: 'ALG-03', name: 'Like & Unlike Terms', group: 'Algebra' },
    { id: 'ALG-04', name: 'Substitution (Basic)', group: 'Algebra' },
    { id: 'ALG-05', name: 'Spider Diagrams (Flow)', group: 'Algebra' },
    { id: 'ALG-06', name: 'Translating Word Problems', group: 'Algebra' }
  ];

  let p = {
    studentId: 'Student',
    xp: 0,
    unlockedNodeIndex: 0,
    completedNodes: []
  };

  document.addEventListener('DOMContentLoaded', () => {
    let saved = localStorage.getItem('harvest_maths_profile');
    if(saved) {
      let parsed = JSON.parse(saved);
      p = { ...p, ...parsed };
    }
    
    // Safety check if arrays got misaligned during development
    if (p.unlockedNodeIndex >= curriculum.length) {
        p.unlockedNodeIndex = curriculum.length - 1;
    }

    renderDashboard();
  });

  function renderDashboard() {
    document.getElementById('student-name').innerText = p.studentId;
    document.getElementById('xp-total').innerText = p.xp || 0;
    
    let activeModule = curriculum[p.unlockedNodeIndex];
    document.getElementById('focus-title').innerText = activeModule.id;
    document.getElementById('focus-section').innerText = activeModule.name;
    document.getElementById('btn-resume').href = `${activeModule.id.toLowerCase()}.html`;

    let container = document.getElementById('curriculum-container');
    container.innerHTML = '';

    // Group curriculum by sections
    let groups = {};
    curriculum.forEach((mod, index) => {
      if(!groups[mod.group]) groups[mod.group] = { total: 0, completed: 0, modules: [], isActiveGroup: false };
      groups[mod.group].total++;
      
      let status = 'locked';
      let icon = '🔒';
      if (p.completedNodes.includes(mod.id)) {
          status = 'completed';
          icon = '✓';
          groups[mod.group].completed++;
      } else if (index === p.unlockedNodeIndex) {
          status = 'current';
          icon = '▶';
          groups[mod.group].isActiveGroup = true;
      } else if (p.studentId.toLowerCase().includes('superuser')) {
          // SuperUser unlocks all links for testing
          status = 'unlocked';
          icon = '🔓';
      }

      groups[mod.group].modules.push(`
        <a href="${(status !== 'locked') ? mod.id.toLowerCase()+'.html' : '#'}" class="module-item ${status}">
          <span>${mod.id}: ${mod.name}</span>
          <span>${icon}</span>
        </a>
      `);
    });

    // Render HTML for groups
    for (let groupName in groups) {
      let g = groups[groupName];
      let isComplete = g.completed === g.total;
      let html = `
        <div class="module-group ${g.isActiveGroup ? 'active-group' : ''}">
          <div class="module-group-header">
            <h3 class="group-name">${groupName}</h3>
            <div class="group-progress ${isComplete ? 'complete' : ''}">
              ${isComplete ? '🏆' : '📊'} ${g.completed}/${g.total} Mastered
            </div>
          </div>
          <div class="module-list">
            ${g.modules.join('')}
          </div>
        </div>
      `;
      container.innerHTML += html;
    }
  }

  function editName() {
    let currentName = p.studentId;
    let newName = prompt("Enter student name (Type 'SuperUser' to unlock all modules & bypass Gatekeepers):", currentName);
    if (newName !== null && newName.trim() !== "") {
      p.studentId = newName.trim();
      localStorage.setItem('harvest_maths_profile', JSON.stringify(p));
      renderDashboard();
    }
  }

  function resetProfile() {
    if(confirm("Are you sure? This will wipe all XP, telemetry, and progress.")) {
      localStorage.removeItem('harvest_maths_profile');
      localStorage.removeItem('harvest_telemetry_queue');
      location.reload();
    }
  }
</script>
</body>
</html>
