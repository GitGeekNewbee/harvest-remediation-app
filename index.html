<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Harvest Concept Lab - Dashboard</title>
  <style>
    /* V2 MATURE COLOR PALETTE & TYPOGRAPHY */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
    
    :root { 
      --slate-50: #f8fafc; --slate-100: #f1f5f9; --slate-200: #e2e8f0; --slate-300: #cbd5e1;
      --slate-400: #94a3b8; --slate-500: #64748b; --slate-700: #334155; --slate-900: #0f172a;
      --indigo: #4f46e5; --indigo-light: #e0e7ff;
      --emerald: #059669; --emerald-light: #d1fae5;
      --rose: #e11d48; --rose-light: #ffe4e6;
      --amber: #d97706; --amber-light: #fef3c7;
      --radius: 8px;
    }
    
    body { font-family: 'Inter', -apple-system, sans-serif; margin: 0; background: var(--slate-50); color: var(--slate-900); display: flex; justify-content: center; height: 100dvh; overflow: hidden; user-select: none; touch-action: manipulation; }
    .app-container { width: 100%; max-width: 500px; background: #ffffff; height: 100%; display: flex; flex-direction: column; position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.05);}
    
    /* DASHBOARD HEADER */
    .dash-header { background: var(--slate-900); color: white; padding: 25px 20px; display: flex; flex-direction: column; gap: 15px; border-bottom: 4px solid var(--indigo); }
    .header-top { display: flex; justify-content: space-between; align-items: center; }
    .app-title { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.5px; margin: 0;}
    .student-id { font-size: 0.85rem; color: var(--slate-400); font-weight: 600; margin-top: 4px;}
    
    .stats-row { display: flex; gap: 10px; }
    .stat-pill { background: rgba(255,255,255,0.1); padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; display: flex; align-items: center; gap: 5px; }
    .stat-xp { color: var(--amber); }
    .stat-streak { color: #f97316; }

    /* SCROLLABLE CONTENT AREA */
    .content-area { flex-grow: 1; overflow-y: auto; padding: 25px 20px; scroll-behavior: smooth; display: flex; flex-direction: column; background: var(--slate-50); }
    
    .section-title { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--slate-500); font-weight: 800; margin-bottom: 15px; margin-top: 10px; }

    /* V2 MODULE GRID */
    .module-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 30px; }
    
    .module-card { background: #ffffff; border: 2px solid var(--slate-200); border-radius: var(--radius); padding: 15px; display: flex; flex-direction: column; justify-content: space-between; min-height: 110px; text-decoration: none; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); position: relative; overflow: hidden; }
    
    .module-badge { font-size: 0.7rem; font-weight: 800; color: var(--slate-500); margin-bottom: 8px; letter-spacing: 0.5px; }
    .module-title { font-size: 0.95rem; font-weight: 700; color: var(--slate-900); line-height: 1.3; }
    .module-icon { align-self: flex-end; font-size: 1.2rem; margin-top: 10px; }

    /* Card States */
    .card-mastered { border-color: var(--emerald); background: var(--emerald-light); }
    .card-mastered .module-badge { color: var(--emerald); }
    
    .card-unlocked { border-color: var(--indigo); box-shadow: 0 4px 12px rgba(79, 70, 229, 0.15); transform: translateY(-2px); }
    .card-unlocked .module-badge { color: var(--indigo); }
    .card-unlocked::after { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--indigo); }
    
    .card-locked { border-color: var(--slate-200); background: var(--slate-100); opacity: 0.6; pointer-events: none; }
    .card-locked .module-title { color: var(--slate-500); }
    
    /* UTILITIES */
    .btn-reset { padding: 10px; background: none; border: 1px solid var(--slate-300); color: var(--slate-500); border-radius: 6px; font-size: 0.8rem; font-weight: 700; cursor: pointer; margin-top: 20px; text-align: center; }
  </style>
</head>
<body>

<div class="app-container">
  
  <!-- HEADER -->
  <header class="dash-header">
    <div class="header-top">
        <div>
            <h1 class="app-title">Concept Lab</h1>
            <div class="student-id" id="display-id">Loading Profile...</div>
        </div>
    </div>
    <div class="stats-row">
        <div class="stat-pill stat-xp">⭐ <span id="display-xp">0</span> XP</div>
        <div class="stat-pill stat-streak">🔥 <span id="display-streak">0</span> Day Streak</div>
    </div>
  </header>

  <!-- CONTENT -->
  <div class="content-area">
    
    <div class="section-title">Rational Numbers</div>
    
    <!-- DYNAMIC GRID -->
    <div class="module-grid" id="rat-grid">
        <!-- JS will populate the module cards here -->
    </div>

    <!-- UTILITY BUTTON FOR TESTING -->
    <button class="btn-reset" onclick="resetProfile()">Reset Test Profile</button>
    
  </div>

</div>

<script>
  // --- V2 SYNCHRONIZED CURRICULUM DATA ---
  const curriculum = [
      { id: 'RAT-01', title: 'Fractions Intro', file: 'rat-01.html' },
      { id: 'RAT-02', title: 'Equivalent Fractions', file: 'rat-02.html' },
      { id: 'RAT-03', title: 'Adding Like Fractions', file: 'rat-03.html' },
      { id: 'RAT-04', title: 'Subtracting Like Fractions', file: 'rat-04.html' },
      { id: 'RAT-05', title: 'Unlike Fractions (+/-)', file: 'rat-05.html' },
      { id: 'RAT-06', title: 'Multiplying Fractions', file: 'rat-06.html' },
      { id: 'RAT-07', title: 'Dividing Fractions', file: 'rat-07.html' },
      { id: 'RAT-08', title: 'Mixed & Improper', file: 'rat-08.html' }
  ];

  let userProfile = {};

  // --- INITIALIZATION ---
  document.addEventListener('DOMContentLoaded', () => {
      loadProfile();
      renderGrid();
  });

  function loadProfile() {
      let saved = localStorage.getItem('harvest_maths_profile');
      if (saved) {
          userProfile = JSON.parse(saved);
      } else {
          // Create new default profile. Diagnostic removed. RAT-01 unlocked by default.
          userProfile = {
              studentId: 'Student_' + Math.floor(Math.random() * 10000),
              xp: 0,
              streak: 1,
              completedNodes: [],
              unlockedNodeIndex: 0, // Starts at 0 (RAT-01)
              gateLevels: {},
              failedAttempts: {},
              remediation: {}
          };
          localStorage.setItem('harvest_maths_profile', JSON.stringify(userProfile));
      }

      document.getElementById('display-id').innerText = userProfile.studentId;
      document.getElementById('display-xp').innerText = userProfile.xp;
      document.getElementById('display-streak').innerText = userProfile.streak || 1;
  }

  function renderGrid() {
      const grid = document.getElementById('rat-grid');
      grid.innerHTML = '';
      
      const isSuperUser = String(userProfile.studentId).toLowerCase().includes('superuser');

      curriculum.forEach((mod, index) => {
          let stateClass = '';
          let icon = '';
          let href = `href="${mod.file}"`;

          // Determine State
          if (userProfile.completedNodes.includes(mod.id)) {
              stateClass = 'card-mastered';
              icon = '✅';
          } else if (index === userProfile.unlockedNodeIndex || isSuperUser) {
              stateClass = 'card-unlocked';
              icon = '▶️';
          } else {
              stateClass = 'card-locked';
              icon = '🔒';
              href = ''; // Disable link for locked items
          }

          // Build Card HTML
          const cardHtml = `
              <a ${href} class="module-card ${stateClass}">
                  <div>
                      <div class="module-badge">${mod.id}</div>
                      <div class="module-title">${mod.title}</div>
                  </div>
                  <div class="module-icon">${icon}</div>
              </a>
          `;
          
          grid.innerHTML += cardHtml;
      });
  }

  function resetProfile() {
      if(confirm("Are you sure you want to reset your local progress?")) {
          let isSuper = String(userProfile.studentId).toLowerCase().includes('superuser');
          let newId = isSuper ? "SuperUser" : ('Student_' + Math.floor(Math.random() * 10000));
          
          let freshProfile = {
              studentId: newId,
              xp: 0,
              streak: 1,
              completedNodes: [],
              unlockedNodeIndex: 0,
              gateLevels: {},
              failedAttempts: {},
              remediation: {}
          };
          localStorage.setItem('harvest_maths_profile', JSON.stringify(freshProfile));
          location.reload();
      }
  }
</script>
</body>
</html>
